[mgr]
show_hidden = true
ratio = [2, 4, 6]
linemode = "size"

[preview]
max_width = 1200
max_height = 1800

[opener]
edit = [
  { run = '$EDITOR %s', block = true },
]
mpv = [
	{ run = 'mpv --keep-open=yes %s', orphan = true },
]
imv = [
	{ run = 'imv %s', orphan = true },
]
zathura = [
	{ run = 'zathura %s', orphan = true },
]

[open]
rules = [ 
  { mime = "video/*", use = "mpv" },
  { mime = "image/*", use = "imv" },
  { mime = "application/pdf", use = "zathura" },
  { mime = "*", use = "edit" },
]
